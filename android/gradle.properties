android.useAndroidX=true
android.enableJetifier=true

# Use Gradle caching to speed up builds (limit to 1 GB)
org.gradle.caching=true
org.gradle.caching.maxSize=1g

# Increase JVM heap and avoid daemon issues that can cause
# "Could not dispatch a message to the daemon" failures.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
